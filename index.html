<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Water Log</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="tracker">
      <header class="tracker-header">
        <div class="title-row">
          <div class="title-left">
            <div class="water-icon">
              <i data-lucide="droplets"></i>
            </div>

            <div>
              <h1>Water Tracker</h1>

              <p class="subtitle">
                Track your daily hydration, feel your best.
              </p>
            </div>
          </div>

          <div class="summary-card">
            <div class="summary">
              <i data-lucide="cup-soda"></i>

              <div>
                <strong id="cupsCount">0 cups</strong>

                <span>of 56 cups</span>
              </div>
            </div>

            <div class="summary-divider"></div>

            <div class="summary">
              <i data-lucide="droplets"></i>

              <div>
                <strong id="weekTotal">0 ml</strong>

                <span>of 14,000 ml</span>
              </div>
            </div>
          </div>
        </div>

        <div class="date-card">
          <button id="prevWeek" class="nav-btn">
            <i data-lucide="chevron-left"></i>
          </button>

          <div>
            <p id="weekRange"></p>

            <p id="monthName" class="month-click"></p>
          </div>

          <button id="nextWeek" class="nav-btn">
            <i data-lucide="chevron-right"></i>
          </button>
        </div>
      </header>

      <div class="days" id="daysContainer"></div>
    </div>

    <script src="script.js"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
